# Despliegue en Render: un solo servicio Node que sirve el front y la API.
#
# No son dos servicios a propósito. El cliente llama a `/api` en relativo, así
# que front y API tienen que compartir origen; en local eso lo resuelve el proxy
# de Vite y en producción lo resuelve `express.static` sobre `web/dist`.
services:
  - type: web
    name: haslap-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22.18.0

      # Sin esta URL el servidor cae al seed en memoria.
      - key: HASLAP_API_URL
        value: https://haslap.okoiagency.com

      - key: JWT_SECRET
        generateValue: true

      # Firebase: las VITE_* se leen al construir y las otras dos solo le dicen
      # al front si ofrecer el acceso por teléfono. Se rellenan en el panel de
      # Render, no aquí, para que cada entorno tenga las suyas.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
