# Despliegue en Render como sitio estático.
#
# No hay servidor propio: el navegador habla directo con el módulo de
# PrestaShop, así que esto es HTML, CSS y JS y nada más.
services:
  - type: web
    name: haslap-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: 22.18.0

      # El backend de PrestaShop. Se lee al CONSTRUIR: si la cambias, hay que
      # volver a desplegar para que entre en el bundle.
      - key: VITE_API_URL
        sync: false

      # Acceso por teléfono. Públicas por diseño, pero se rellenan en el panel
      # para que cada entorno tenga las suyas y no vivan en git.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false

    # El router vive en el navegador: sin esto, recargar en /eventos da 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
